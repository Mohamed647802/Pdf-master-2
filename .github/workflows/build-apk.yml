name: 🤖 Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip python3-pip python3-dev \
            libffi-dev libssl-dev libjpeg-dev \
            zlib1g-dev openjdk-17-jdk \
            autoconf automake libtool \
            build-essential ccache

      - name: 📱 Install Buildozer & Kivy
        run: |
          pip install --upgrade pip setuptools
          pip install buildozer cython==0.29.33

      - name: 🏗️ Build APK
        working-directory: ./android
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          java -version
          yes | buildozer -v android debug

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDFMaster-APK
          path: |
            android/bin/*.apk
            android/.buildozer/android/platform/build-*/dists/*/bin/*.apk
          retention-days: 30
